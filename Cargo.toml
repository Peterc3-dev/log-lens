[package]
name = "log-lens"
version = "0.1.0"
edition = "2021"
description = "Streaming log viewer TUI with filtering and highlighting"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
regex = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
chrono = "0.4"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
